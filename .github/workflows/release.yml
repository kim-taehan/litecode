# main 머지(또는 수동) 시 설치 파일 자동 빌드 + 릴리스 생성 (#441)
# 산출물은 로컬 `npm run dist:mac` / `npm run dist:win` 과 동일: litecode-mac-arm64.zip · litecode-mac-x64.zip · litecode-win-x64.exe.
# 버전은 최신 릴리스 태그 다음 패치 — v* 태그가 버전의 단일 출처다. 태그가 없으면 첫 릴리스 v0.0.2 (레거시 v0.1.x 태그 제거, #447). mac 은 ci 에 서명 인증서가 없어 afterPack.cjs 가 ad-hoc 으로 서명한다.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  next-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # git tag 도 REST /releases 도 안 된다 — 기존 v0.1.x 릴리스는 태그 ref 없이 만든 것이라
          # matching-refs 에 없고 /releases(REST)·/releases/latest 는 404. GraphQL 기반 gh release list 로
          # 최신 non-prerelease 를 잡는다 (모바일 mobile-vX.Y.Z 는 pre-release 라 제외).
          LATEST="$(gh release list --limit 20 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease|not)][0].tagName // empty' 2>/dev/null || true)"
          if [ -n "$LATEST" ]; then
            N="${LATEST#v}"
            C="${N##*.}"
            NEXT="${N%.*}.$((C + 1))"
          else
            NEXT="0.0.2"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "릴리스 버전: $NEXT (이전: ${LATEST:-없음})"

  mac:
    needs: next-version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pkg set version="${{ needs.next-version.outputs.version }}"
      # dist 스크립트의 fetch-*.mjs --check 는 "있으면 통과" — 없으면 실패. 그래서 여기에서 먼저 받는다 (캐시 포함)
      - uses: actions/cache@v4
        with:
          path: build/vendor
          key: vendor-mac-${{ hashFiles('scripts/fetch-opencode.mjs', 'scripts/fetch-speech.mjs', 'scripts/fetch-browser.mjs') }}
      - name: Fetch bundled binaries
        run: |
          node scripts/fetch-opencode.mjs mac-arm64 mac-x64
          node scripts/fetch-speech.mjs mac-arm64 mac-x64
          node scripts/fetch-browser.mjs
      # --publish never — electron-builder 가 CI 에서 알아서 GitHub 에 올리려 하면 토큰 없는데서 죽는다. 릴리스는 아래 release 잡이 만든다
      - run: npm run dist:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/litecode-mac-arm64.zip
            release/litecode-mac-x64.zip

  win:
    needs: next-version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pkg set version="${{ needs.next-version.outputs.version }}"
      # dist 스크립트의 fetch-*.mjs --check 는 "있으면 통과" — 없으면 실패. 그래서 여기에서 먼저 받는다 (캐시 포함)
      - uses: actions/cache@v4
        with:
          path: build/vendor
          key: vendor-win-${{ hashFiles('scripts/fetch-opencode.mjs', 'scripts/fetch-speech.mjs', 'scripts/fetch-browser.mjs') }}
      - name: Fetch bundled binaries
        run: |
          node scripts/fetch-opencode.mjs win-x64
          node scripts/fetch-speech.mjs win-x64
          node scripts/fetch-browser.mjs
      # --publish never — electron-builder 가 CI 에서 알아서 GitHub 에 올리려 하면 토큰 없는데서 죽는다. 릴리스는 아래 release 잡이 만든다
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: release\litecode-win-x64.exe

  release:
    needs: [next-version, mac, win]
    runs-on: ubuntu-latest
    steps:
      # gh release create --target 이 태그를 만들 git 저장소가 필요하다 ("not a git repository" 로 죽음)
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist/m
      - uses: actions/download-artifact@v4
        with:
          name: win
          path: dist/w
      - name: Create release
        run: |
          VER="${{ needs.next-version.outputs.version }}"
          gh release create "v$VER" --title "litecode $VER" --generate-notes \
            --target "$GITHUB_SHA" \
            dist/m/litecode-mac-arm64.zip dist/m/litecode-mac-x64.zip dist/w/litecode-win-x64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
