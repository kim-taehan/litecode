<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SonarQube</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f26;--sub:#6b7180;--faint:#9aa0ab;--line:#e3e5ea;--soft:#eef0f4;--accent:#4176e6;--ok:#23774a;--ok-bg:#e9f6ee;--bad:#a12a2f;--bad-bg:#fdecec;--warn:#9a5b00;--warn-bg:#fff3e0;--btn:#1c1f26;--btn-text:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2228;--text:#e8eaf0;--sub:#a3a9b5;--faint:#7c8290;--line:#2e323a;--soft:#2a2e36;--accent:#7aa2ff;--ok:#6fd39b;--ok-bg:#1d3327;--bad:#ff8a8f;--bad-bg:#3a2224;--warn:#f5b860;--warn-bg:#3a2e1c;--btn:#e8eaf0;--btn-text:#16181d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif}
main{display:flex;flex-direction:column;gap:12px;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
h1{margin:0;font-size:15px;font-weight:600}
.sub{color:var(--sub);font-size:12px}
.faint{color:var(--faint)}
button{font:inherit;cursor:pointer;border-radius:8px;height:30px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button.primary{border:0;background:var(--btn);color:var(--btn-text);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.chip{height:28px;padding:0 12px;border-radius:14px;font-size:12.5px}
.chip[aria-checked=true]{border:0;background:var(--btn);color:var(--btn-text)}
.path{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:6px;background:var(--soft);font:12px ui-monospace,Menlo,monospace}
.path button{height:20px;width:20px;padding:0;border:0;background:transparent;color:var(--faint)}
.steps{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub);margin-top:10px}
.steps .now{color:var(--text)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:6px;background:var(--accent);transition:width .3s}
.gate{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px}
.gate.ok{background:var(--ok-bg);color:var(--ok)}
.gate.bad{background:var(--bad-bg);color:var(--bad)}
.gate b{font-size:14px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.metric{padding:10px;border:1px solid var(--line);border-radius:10px}
.metric span{display:block;font-size:11.5px;color:var(--sub)}
.metric b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.issue{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.sev{flex-shrink:0;margin-top:2px;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;line-height:18px}
.sev.high{background:var(--bad-bg);color:var(--bad)}
.sev.mid{background:var(--warn-bg);color:var(--warn)}
.sev.low{background:var(--soft);color:var(--sub)}
.fix{height:24px;padding:0 8px;font-size:11.5px}
.file{border:0;background:none;padding:0;height:auto;color:var(--accent);font:12px ui-monospace,Menlo,monospace;text-align:left;cursor:pointer}
.error{padding:8px 10px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.note{padding:8px 10px;border-radius:8px;background:var(--soft);color:var(--sub);font-size:12.5px}
label.check{display:flex;align-items:center;gap:8px;font-size:12.5px}
.tree{margin-left:40px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 0}
.tree-row{display:flex;align-items:center;gap:4px;height:28px;padding-right:6px}
.tree-row:hover{background:var(--soft)}
.twist{width:20px;height:20px;padding:0;border:0;background:transparent;color:var(--sub);display:inline-grid;place-items:center;flex-shrink:0}
.tree-name{font:12px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-add{height:22px;padding:0 8px;font-size:11.5px}
/* 로그 창 (이슈 #551) — 패널 아래쪽 작은 창, 숨길 수 있다. #app 을 다시 그려도 스크롤이 흔들리지 않게 따로 둔다 */
.log{position:sticky;bottom:0;margin:0 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 -4px 16px rgba(0,0,0,.06);display:flex;flex-direction:column}
.log[hidden],.log-show[hidden]{display:none}
.log-head{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line)}
.log-head button{height:24px;padding:0 10px;font-size:12px}
.log-tabs{display:flex;gap:4px}
.log-tabs button[aria-selected=true]{border:0;background:var(--btn);color:var(--btn-text)}
#log-text{height:160px;overflow:auto;padding:8px 10px;max-height:none;font:11px/1.45 ui-monospace,Menlo,monospace;color:var(--sub);white-space:pre-wrap;word-break:break-all}
.log-show{position:sticky;bottom:12px;margin:0 12px 12px auto;display:block;height:28px;font-size:12px}
pre{margin:0;max-height:160px;overflow:auto;font:11px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<main id="app"><div class="card pad sub">불러오는 중…</div></main>
<section id="log" class="log" hidden>
  <div class="log-head">
    <span class="log-tabs" role="tablist" aria-label="로그">
      <button role="tab" id="log-server" aria-selected="true">서버</button>
      <button role="tab" id="log-scanner" aria-selected="false">분석</button>
    </span>
    <span class="grow"></span>
    <button id="log-hide" aria-label="로그 숨기기">숨기기</button>
  </div>
  <pre id="log-text" role="log" aria-live="off"></pre>
</section>
<button id="log-show" class="log-show" hidden>로그 보기</button>
<script>
// SonarQube 확장 패널 (이슈 #545) — 확장에 든 SonarQube 를 이 기기에서 띄우고, 지금 프로젝트를 분석해 결과를 본다.
// 앱과는 통로로만 말한다: parent.postMessage({ litecode: 1, id, method, params }) → { litecode: 1, id, ok, result | error }.
// 내장 서버로 가는 network.fetch 는 동의 없이 닿고 인증은 앱이 붙인다 — 이 패널은 토큰을 모른다.

let seq = 0
const waiting = new Map()
window.addEventListener('message', (event) => {
  const data = event.data
  if (event.source !== parent || !data || data.litecode !== 1 || !waiting.has(data.id)) return
  const { resolve } = waiting.get(data.id)
  waiting.delete(data.id)
  resolve(data)
})
/** 통로 호출 — 실패면 Error(code) 를 던진다 */
function call(method, params) {
  const id = ++seq
  return new Promise((resolve, reject) => {
    waiting.set(id, { resolve: (reply) => (reply.ok ? resolve(reply.result) : reject(new Error(reply.error))) })
    parent.postMessage({ litecode: 1, id, method, params }, '*')
  })
}

const state = {
  server: undefined, // server.status 결과
  project: undefined, // { name, projectKey }
  scope: 'all', // all | paths | changes
  paths: [],
  changes: undefined, // { base, files } | { error }
  analysis: undefined, // { phase: 'scanning' | 'processing' | 'done' | 'failed', detail }
  results: undefined, // { key, gate, measures, issues, total, missing } | { error }
  error: undefined,
}

const PHASES = ['port', 'launching', 'starting', 'admin', 'running']
const PHASE_TEXT = { port: '포트 확인', launching: '서버 띄우기', starting: '시작하는 중', admin: '관리자 토큰 만들기', running: '실행 중' }
const FAILURE_TEXT = {
  'port-in-use': '다른 프로그램이 포트를 쓰고 있습니다',
  'spawn-failed': '서버 실행 파일을 띄우지 못했습니다',
  exited: '서버가 스스로 꺼졌습니다',
  'not-ready': '제한 시간 안에 서버가 준비되지 않았습니다',
  'admin-failed': '관리자 토큰을 만들지 못했습니다',
}
const ERROR_TEXT = {
  'no-project': '열린 프로젝트가 없습니다',
  'server-not-running': '서버가 실행 중이 아닙니다',
  'scope-empty': '고른 범위에 분석할 파일이 없습니다',
  'analysis-failed': '분석에 실패했습니다',
  busy: '이미 분석하고 있습니다',
  'git-unavailable': 'git 이 없어 내 변경을 알 수 없습니다',
  'not-a-repo': '이 프로젝트는 git 저장소가 아닙니다',
  'too-many-changes': '바뀐 파일이 너무 많습니다 — 폴더로 골라 주세요',
}
const text = (code) => ERROR_TEXT[code] || code

const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag)
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === false) continue
    if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else if (key === 'class') node.className = value
    else node.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child)
  return node
}

// --- 서버 ---

async function refreshServer() {
  try {
    state.server = await call('server.status')
  } catch (error) {
    state.error = error.message
  }
  render()
}

async function serverAction(method) {
  if (method === 'server.start') showLog('server')
  try {
    state.server = await call(method)
  } catch (error) {
    state.error = error.message
  }
  render()
}

async function setOption(key, value) {
  state.server = await call('server.setOptions', { [key]: value })
  render()
}

let pollTimer
function schedule() {
  clearTimeout(pollTimer)
  const phase = state.server?.phase
  const busy = phase && phase !== 'stopped' && phase !== 'failed' && phase !== 'running'
  pollTimer = setTimeout(async () => {
    const before = state.server?.phase
    await refreshServer()
    if (before !== 'running' && state.server?.phase === 'running') loadResults()
    schedule()
  }, busy ? 1000 : 5000)
}

// --- 내장 서버 요청 ---

async function api(pathAndQuery) {
  const response = await call('network.fetch', { url: state.server.url + pathAndQuery, method: 'GET' })
  if (response.status === 404) return undefined
  if (response.status >= 400) throw new Error(`HTTP ${response.status}`)
  return JSON.parse(response.body)
}

const resultKey = () => (state.scope === 'all' ? state.project.projectKey : `${state.project.projectKey}__scope`)

// --- 마지막 결과 보관 (이슈 #553) — 서버가 꺼져 있거나 앱을 다시 켜도 보인다. 확장 저장소(storage)에 두어 확장을 지울 때 함께 지워진다.
// 저장소는 확장당 64KB 라 결과 키 두 개(전체·범위)까지, 이슈는 필요한 필드만, 넘치면 이슈를 줄여 담는다

const SAVED = 'results'
const saved = {}

function compact(r, issueCount) {
  return {
    key: r.key,
    savedAt: new Date().toISOString(),
    analysisDate: r.analysisDate,
    gate: r.gate && { status: r.gate.status, conditions: (r.gate.conditions ?? []).filter((c) => c.status === 'ERROR').map(({ metricKey, actualValue, errorThreshold, status }) => ({ metricKey, actualValue, errorThreshold, status })) },
    values: r.values,
    total: r.total,
    issues: r.issues.slice(0, issueCount).map(({ key, rule, severity, type, message, component, line }) => ({ key, rule, severity, type, message, component, line })),
  }
}

async function keepResults(r) {
  const keys = [r.key, ...Object.keys(saved).filter((k) => k !== r.key)].slice(0, 2)
  for (const issueCount of [100, 50, 20, 0]) {
    const next = Object.fromEntries(keys.map((k) => [k, k === r.key ? compact(r, issueCount) : saved[k]]))
    if (JSON.stringify(next).length > 60 * 1024) continue
    try {
      await call('storage.set', { key: SAVED, value: next })
      for (const k of Object.keys(saved)) delete saved[k]
      Object.assign(saved, next)
    } catch {
      // 보관은 보조 — 못 해도 화면은 그대로
    }
    return
  }
}

async function forgetResults(key) {
  if (!saved[key]) return
  delete saved[key]
  await call('storage.set', { key: SAVED, value: saved }).catch(() => {})
}

async function loadSaved() {
  try {
    Object.assign(saved, (await call('storage.get', { key: SAVED })) ?? {})
  } catch {
    // 없다
  }
}

async function loadResults() {
  if (!state.project || state.server?.phase !== 'running') return
  const key = resultKey()
  try {
    const q = encodeURIComponent(key)
    const component = await api(`/api/components/show?component=${q}`)
    if (!component) {
      state.results = { key, missing: true }
      forgetResults(key)
      return render()
    }
    const [gate, measures, issues] = await Promise.all([
      api(`/api/qualitygates/project_status?projectKey=${q}`),
      api(`/api/measures/component?component=${q}&metricKeys=bugs,vulnerabilities,coverage,duplicated_lines_density`),
      api(`/api/issues/search?componentKeys=${q}&resolved=false&ps=100&s=SEVERITY&asc=false`),
    ])
    const values = Object.fromEntries((measures?.component?.measures ?? []).map((m) => [m.metric, m.value]))
    state.results = { key, analysisDate: component.component?.analysisDate, gate: gate?.projectStatus, values, issues: issues?.issues ?? [], total: issues?.paging?.total ?? issues?.total ?? 0 }
    keepResults(state.results)
  } catch (error) {
    state.results = { key, error: error.message }
  }
  render()
}

// --- 범위·분석 ---

async function setScope(scope) {
  state.scope = scope
  state.results = undefined
  if (scope === 'changes' && !state.changes) {
    try {
      state.changes = await call('project.changedFiles')
    } catch (error) {
      state.changes = { error: error.message }
    }
  }
  render()
  loadResults()
}

// 폴더·파일 고르기 — 패널 안의 프로젝트 트리(project.listDir). OS 고르기 창은 프로젝트 밖으로 나갈 수 있어 쓰지 않는다 (이슈 #548)
const tree = { open: false, dirs: new Map(), expanded: new Set() }

async function loadDir(dir) {
  try {
    tree.dirs.set(dir, await call('project.listDir', { path: dir }))
  } catch (error) {
    tree.dirs.set(dir, { error: error.message, entries: [] })
  }
  render()
}

function toggleTree() {
  tree.open = !tree.open
  if (tree.open && !tree.dirs.has('')) loadDir('')
  render()
}

function toggleDir(dir) {
  if (tree.expanded.has(dir)) tree.expanded.delete(dir)
  else {
    tree.expanded.add(dir)
    if (!tree.dirs.has(dir)) loadDir(dir)
  }
  render()
}

function addPath(p) {
  if (!state.paths.includes(p)) state.paths.push(p)
  render()
}

function treeRows(dir, depth) {
  const listing = tree.dirs.get(dir)
  if (!listing) return [el('div', { class: 'sub', style: `padding-left:${depth * 16 + 8}px` }, '불러오는 중…')]
  if (listing.error) return [el('div', { class: 'sub', style: `padding-left:${depth * 16 + 8}px` }, text(listing.error))]
  const rows = []
  for (const entry of listing.entries) {
    const full = dir === '' ? entry.name : `${dir}/${entry.name}`
    const key = entry.dir ? `${full}/` : full
    const added = state.paths.includes(key)
    rows.push(
      el(
        'div',
        { class: 'tree-row', style: `padding-left:${depth * 16 + 4}px` },
        entry.dir
          ? el('button', { class: 'twist', 'aria-label': `${entry.name} 펼치기`, 'aria-expanded': String(tree.expanded.has(full)), onclick: () => toggleDir(full) }, tree.expanded.has(full) ? '▾' : '▸')
          : el('span', { class: 'twist' }),
        el('span', { class: 'grow tree-name' }, entry.dir ? `${entry.name}/` : entry.name),
        el('button', { class: 'tree-add', disabled: added, onclick: () => addPath(key) }, added ? '추가됨' : '추가'),
      ),
    )
    if (entry.dir && tree.expanded.has(full)) rows.push(...treeRows(full, depth + 1))
  }
  if (listing.truncated) rows.push(el('div', { class: 'sub', style: `padding-left:${depth * 16 + 8}px` }, '항목이 많아 일부만 보입니다'))
  return rows
}

function scopePaths() {
  if (state.scope === 'paths') return state.paths
  if (state.scope === 'changes') return state.changes?.files ?? []
  return undefined
}

async function analyze() {
  const paths = scopePaths()
  showLog('scanner')
  state.analysis = { phase: 'scanning' }
  render()
  let result
  try {
    result = await call('server.analyze', paths === undefined ? {} : { paths })
  } catch (error) {
    state.analysis = { phase: 'failed', detail: text(error.message) }
    return render()
  }
  if (!result.ok) {
    state.analysis = { phase: 'failed', detail: text(result.error), log: result.detail }
    return render()
  }
  state.analysis = { phase: 'processing', skipped: result.skipped }
  render()
  // 서버가 올린 결과를 처리하는 동안 기다린다
  for (let i = 0; result.taskId && i < 300; i++) {
    const task = await api(`/api/ce/task?id=${encodeURIComponent(result.taskId)}`).catch(() => undefined)
    const status = task?.task?.status
    if (status === 'SUCCESS') break
    if (status === 'FAILED' || status === 'CANCELED') {
      state.analysis = { phase: 'failed', detail: `서버가 결과를 처리하지 못했습니다 (${status})`, log: task?.task?.errorMessage }
      return render()
    }
    await new Promise((resolve) => setTimeout(resolve, 1000))
  }
  state.analysis = { phase: 'done', skipped: result.skipped }
  await loadResults()
}

// --- 그리기 ---

function serverCard() {
  const s = state.server
  const phase = s.phase
  const index = PHASES.indexOf(phase)
  const busy = index >= 0 && phase !== 'running'
  const dot = phase === 'running' ? 'var(--ok)' : phase === 'failed' ? 'var(--bad)' : busy || phase === 'stopping' ? '#e0a100' : 'var(--faint)'
  const title = phase === 'running' ? '실행 중' : phase === 'failed' ? '실패' : phase === 'stopping' ? '멈추는 중…' : phase === 'stopped' ? '꺼져 있음' : '시작하는 중…'
  return el(
    'section',
    { class: 'card pad' },
    el(
      'div',
      { class: 'row' },
      el('span', { style: `width:8px;height:8px;border-radius:4px;background:${dot}` }),
      el('span', { class: 'grow' }, el('b', {}, `SonarQube 서버 · ${title}`), busy ? el('span', { class: 'faint' }, ' 1분 남짓 걸립니다') : null),
      phase === 'running' || busy
        ? el('button', { onclick: () => serverAction('server.stop'), disabled: phase === 'stopping' }, '멈추기')
        : el('button', { class: 'primary', onclick: () => serverAction('server.start'), disabled: phase === 'stopping' }, '띄우기'),
    ),
    busy
      ? [
          el('div', { class: 'bar' }, el('i', { style: `width:${Math.round(((index + 0.5) / PHASES.length) * 100)}%` })),
          el(
            'div',
            { class: 'steps' },
            PHASES.slice(0, -1).map((p, i) => el('span', { class: i === index ? 'now' : '' }, `${i < index ? '✓' : i === index ? '…' : '·'} ${PHASE_TEXT[p]}${i === index && s.detail ? ` (${s.detail})` : ''}`)),
          ),
        ]
      : null,
    phase === 'failed' ? el('div', { class: 'error', style: 'margin-top:10px' }, `${FAILURE_TEXT[s.error] || s.error}${s.detail ? ` — ${s.detail}` : ''}`) : null,
    el(
      'div',
      { class: 'sub', style: 'margin-top:10px;display:flex;flex-direction:column;gap:4px' },
      el('span', {}, `주소 ${s.url} · 이 기기에서만 접속 · 메모리 약 2GB`),
      el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: s.options.startWithApp, onchange: (e) => setOption('startWithApp', e.target.checked) }), '앱을 켤 때 같이 띄우기'),
      el('label', { class: 'check' }, el('input', { type: 'checkbox', checked: s.options.stopWithApp, onchange: (e) => setOption('stopWithApp', e.target.checked) }), '앱을 끌 때 같이 내리기'),
    ),
  )
}

function scopeRow() {
  const chip = (value, label) => el('button', { class: 'chip', role: 'radio', 'aria-checked': String(state.scope === value), onclick: () => setScope(value) }, label)
  const rows = [el('div', { class: 'row', role: 'radiogroup', 'aria-label': '검토 범위' }, el('span', { class: 'sub', style: 'width:32px' }, '범위'), chip('all', '전체'), chip('paths', '폴더·파일'), chip('changes', '내 변경'))]
  if (state.scope === 'paths') {
    rows.push(
      el(
        'div',
        { class: 'row', style: 'flex-wrap:wrap;padding-left:40px' },
        state.paths.map((p) => el('span', { class: 'path' }, p, el('button', { 'aria-label': `${p} 빼기`, onclick: () => ((state.paths = state.paths.filter((x) => x !== p)), render()) }, '×'))),
        el('button', { style: 'height:26px;border-style:dashed;font-size:12px', 'aria-expanded': String(tree.open), onclick: toggleTree }, tree.open ? '닫기' : '+ 폴더·파일 고르기'),
      ),
    )
    if (tree.open) rows.push(el('div', { class: 'tree', role: 'tree', 'aria-label': `${state.project?.name ?? ''} 폴더` }, el('div', { class: 'sub', style: 'padding:4px 8px' }, `${state.project?.name ?? '프로젝트'} 안에서만 고를 수 있습니다`), treeRows('', 0)))
  }
  if (state.scope === 'changes') {
    const c = state.changes
    rows.push(el('div', { class: 'sub', style: 'padding-left:40px' }, !c ? '불러오는 중…' : c.error ? text(c.error) : `바뀐 파일 ${c.files.length}개${c.base ? ` · ${c.base} 대비` : ' · 커밋 안 한 것만'}`))
  }
  return el('div', { style: 'display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--line)' }, rows)
}

function analysisNote() {
  const a = state.analysis
  if (!a) return null
  if (a.phase === 'scanning') return el('div', { class: 'note' }, '분석하는 중… (전체는 수십 초 걸립니다)')
  if (a.phase === 'processing') return el('div', { class: 'note' }, '서버가 결과를 정리하는 중…')
  if (a.phase === 'failed') return el('div', { class: 'error' }, a.detail, a.log ? el('pre', {}, a.log) : null)
  if (a.skipped?.length) return el('div', { class: 'note' }, `없는 경로는 빼고 분석했습니다: ${a.skipped.join(', ')}`)
  return null
}

const SEVERITY = { BLOCKER: ['높음', 'high'], CRITICAL: ['높음', 'high'], MAJOR: ['보통', 'mid'], MINOR: ['낮음', 'low'], INFO: ['낮음', 'low'] }
const TYPE = { BUG: '버그', VULNERABILITY: '취약점', CODE_SMELL: '코드 냄새', SECURITY_HOTSPOT: '보안 검토' }
const GATE_METRIC = { new_coverage: '새 코드 커버리지', coverage: '커버리지', new_bugs: '새 버그', new_vulnerabilities: '새 취약점', new_duplicated_lines_density: '새 코드 중복', new_security_hotspots_reviewed: '보안 검토율', new_reliability_rating: '새 코드 신뢰성', new_security_rating: '새 코드 보안', new_maintainability_rating: '새 코드 유지보수성', new_violations: '새 이슈' }

const running = () => state.server?.phase === 'running'

// --- 수정 요청 (이슈 #557·#559) — 지금 프로젝트에 새 대화를 열고 요청 글을 곧바로 보낸다(chat.compose send). 덧붙일 말은 그 대화에서 이어서
const picked = new Set()

function fixPrompt(issues, prefix) {
  const lines = issues.map((issue) => {
    const file = issue.component.startsWith(prefix) ? issue.component.slice(prefix.length) : issue.component
    const [label] = SEVERITY[issue.severity] || ['낮음']
    return `- \`${file}${issue.line ? `:${issue.line}` : ''}\` — [${TYPE[issue.type] || '이슈'} · ${label}]${issue.rule ? ` (규칙 ${issue.rule})` : ''} ${issue.message}`
  })
  return [`SonarQube 가 찾은 이슈${issues.length > 1 ? ` ${issues.length}개` : ''}를 고쳐 주세요.`, '', ...lines, '', '고친 뒤 같은 규칙에 걸리는 곳이 더 있는지도 봐 주세요.'].join('\n')
}

async function askFix(issues, prefix) {
  if (!issues.length) return
  try {
    await call('chat.compose', { text: fixPrompt(issues, prefix), send: true })
    picked.clear()
    render()
  } catch (error) {
    state.error = text(error.message)
    render()
  }
}

function results() {
  const r = running() ? state.results : saved[resultKey()]
  if (!r) return el('div', { class: 'sub pad' }, running() ? '결과를 불러오는 중…' : '이 범위의 보관된 결과가 없습니다. 서버를 띄우면 읽거나 분석할 수 있습니다.')
  if (r.error) return el('div', { class: 'pad' }, el('div', { class: 'error' }, `결과를 읽지 못했습니다 — ${r.error}`))
  if (r.missing) return el('div', { class: 'pad sub' }, state.scope === 'all' ? '아직 분석하지 않았습니다. [분석] 을 누르세요.' : '이 범위로 아직 분석하지 않았습니다. [분석] 을 누르세요.')
  const failed = (r.gate?.conditions ?? []).filter((c) => c.status === 'ERROR')
  const gateOk = r.gate?.status === 'OK'
  const prefix = `${r.key}:`
  const v = r.values
  const fmt = (value, unit = '') => (value === undefined ? '—' : `${value}${unit}`)
  return [
    el(
      'div',
      { class: 'pad', style: 'display:flex;flex-direction:column;gap:12px' },
      r.gate
        ? el('div', { class: `gate ${gateOk ? 'ok' : 'bad'}` }, el('span', { class: 'grow' }, el('b', {}, gateOk ? '품질 게이트 통과' : '품질 게이트 실패'), failed.length ? el('div', { style: 'font-size:12px' }, failed.map((c) => `${GATE_METRIC[c.metricKey] || c.metricKey} ${c.actualValue} (기준 ${c.errorThreshold})`).join(' · ')) : null))
        : null,
      el('div', { class: 'metrics' }, [
        el('div', { class: 'metric' }, el('span', {}, '버그'), el('b', {}, fmt(v.bugs))),
        el('div', { class: 'metric' }, el('span', {}, '취약점'), el('b', {}, fmt(v.vulnerabilities))),
        el('div', { class: 'metric' }, el('span', {}, '커버리지'), el('b', {}, fmt(v.coverage, '%'))),
        el('div', { class: 'metric' }, el('span', {}, '중복'), el('b', {}, fmt(v.duplicated_lines_density, '%'))),
      ]),
      el(
        'div',
        { class: 'row' },
        el('b', { class: 'grow' }, `열린 이슈 ${r.total}`),
        r.total > r.issues.length ? el('span', { class: 'sub' }, `위 ${r.issues.length}개만`) : null,
        picked.size ? el('button', { class: 'primary', onclick: () => askFix(r.issues.filter((issue) => picked.has(issue.key)), prefix) }, `선택한 이슈 수정 요청 (${picked.size})`) : null,
      ),
    ),
    r.issues.map((issue) => {
      const [label, tone] = SEVERITY[issue.severity] || ['낮음', 'low']
      const file = issue.component.startsWith(prefix) ? issue.component.slice(prefix.length) : issue.component
      return el(
        'div',
        { class: 'issue' },
        el('input', { type: 'checkbox', 'aria-label': `${issue.message} 고르기`, checked: picked.has(issue.key), onchange: (e) => (e.target.checked ? picked.add(issue.key) : picked.delete(issue.key), render()), style: 'margin-top:3px' }),
        el('span', { class: `sev ${tone}` }, label),
        el(
          'span',
          { class: 'grow', style: 'display:flex;flex-direction:column;gap:3px' },
          el('span', {}, issue.message),
          el('button', { class: 'file', onclick: () => call('project.openFile', { path: file, ...(issue.line ? { line: issue.line } : {}) }).catch(() => {}) }, `${file}${issue.line ? `:${issue.line}` : ''}`),
        ),
        el('span', { style: 'flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px' }, el('span', { class: 'sub' }, TYPE[issue.type] || ''), el('button', { class: 'fix', onclick: () => askFix([issue], prefix) }, '수정 요청')),
      )
    }),
  ]
}

function render() {
  const app = document.getElementById('app')
  const parts = []
  if (state.error) parts.push(el('div', { class: 'error' }, text(state.error)))
  if (state.server) parts.push(serverCard())
  if (state.project && (running() || saved[resultKey()] || Object.keys(saved).length)) {
    const analyzing = state.analysis?.phase === 'scanning' || state.analysis?.phase === 'processing'
    const shown = running() ? state.results : saved[resultKey()]
    const when = shown?.analysisDate ? new Date(shown.analysisDate).toLocaleString() : undefined
    parts.push(
      el(
        'section',
        { class: 'card' },
        el(
          'div',
          { class: 'row pad' },
          el('div', { class: 'grow' }, el('h1', {}, state.project.projectKey), el('div', { class: 'sub' }, when ? `마지막 분석 ${when}` : state.project.name, state.scope !== 'all' ? ' · 범위 결과는 따로 보관합니다' : '', running() ? '' : ' · 서버 꺼짐 — 마지막 결과')),
          el('button', { class: 'primary', onclick: analyze, title: running() ? undefined : '서버를 띄우면 분석할 수 있습니다', disabled: !running() || analyzing || (state.scope === 'paths' && state.paths.length === 0) || (state.scope === 'changes' && !(state.changes?.files?.length)) }, analyzing ? '분석 중…' : '분석'),
          el('button', { 'aria-label': '다시 읽기', onclick: loadResults }, '↻'),
        ),
        scopeRow(),
        analysisNote() ? el('div', { style: 'padding:0 16px 12px' }, analysisNote()) : null,
        el('div', { style: 'border-top:1px solid var(--line)' }, results()),
      ),
    )
  }
  app.replaceChildren(...parts)
}

// --- 로그 창 (이슈 #551) ---

const log = { open: false, source: 'server', timer: undefined }
const logBox = document.getElementById('log')
const logText = document.getElementById('log-text')
const logShow = document.getElementById('log-show')

function showLog(source) {
  log.source = source
  setLogOpen(true)
}

function setLogOpen(open) {
  log.open = open
  logBox.hidden = !open
  logShow.hidden = open
  for (const name of ['server', 'scanner']) document.getElementById(`log-${name}`).setAttribute('aria-selected', String(log.source === name))
  clearTimeout(log.timer)
  if (open) pollLog()
}

async function pollLog() {
  try {
    const { text } = await call('server.log', { source: log.source })
    // 맨 아래를 보고 있을 때만 따라 내려간다 — 위로 올려 읽는 중이면 그대로
    const atBottom = logText.scrollHeight - logText.scrollTop - logText.clientHeight < 24
    if (logText.textContent !== text) {
      logText.textContent = text || (log.source === 'server' ? '아직 서버 로그가 없습니다' : '아직 분석 로그가 없습니다')
      if (atBottom) logText.scrollTop = logText.scrollHeight
    }
  } catch {
    // 다음 번에 다시
  }
  if (log.open) log.timer = setTimeout(pollLog, 1000)
}

document.getElementById('log-server').addEventListener('click', () => showLog('server'))
document.getElementById('log-scanner').addEventListener('click', () => showLog('scanner'))
document.getElementById('log-hide').addEventListener('click', () => setLogOpen(false))
logShow.addEventListener('click', () => setLogOpen(true))

async function start() {
  try {
    state.project = await call('server.project')
    await loadSaved()
  } catch (error) {
    state.error = error.message
  }
  await refreshServer()
  // 서버가 뜨는 중이면 로그 창을 연다. 그 밖에는 [로그 보기] 만
  const phase = state.server?.phase
  if (phase && phase !== 'stopped' && phase !== 'running' && phase !== 'failed') showLog('server')
  else if (state.server) logShow.hidden = false
  if (state.server?.phase === 'running') loadResults()
  schedule()
}
start()
</script>
