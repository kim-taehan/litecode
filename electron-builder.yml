# electron-builder 설정 — 폐쇄망 PC 에 설치본 하나로 들어가게 opencode·rg 를 싣는다 (closed-code/desktop 설정을 옮겼다).
# 공증은 없다. mac 은 build/afterPack.cjs 가 키체인의 "litecode-dev"(개발 Mac 자체 서명) 또는 ad-hoc 으로 서명한다.
# Electron 바이너리는 ~/Library/Caches/electron 의 electron-v33.4.11-<os>-<arch>.zip 을 쓴다 (이 머신은 electron 다운로드가 막혀 있다).
appId: com.litecode.desktop
productName: litecode

directories:
  output: release
  buildResources: build

afterPack: build/afterPack.cjs

# 컴파일된 메인(dist-electron) + 렌더러 번들(dist/renderer) + 매니페스트. 런타임 의존성(cordis 등)은 electron-builder 가 넣는다
files:
  - dist-electron/**/*
  - dist/**/*
  - package.json
  - '!**/*.map'

asar: true

# 받는 것은 scripts/fetch-opencode.mjs (build/vendor/ 는 gitignore). 런타임 자리는 src/services/opencodeBinary.ts bundledPaths:
#   mac  Contents/Resources/opencode/opencode · Contents/Resources/rg/rg
#   win  resources/opencode/opencode.exe      · resources/rg/rg.exe
# `${platform}` 이 아니라 `${os}` 다 — `${platform}` 은 빌드하는 머신 값이라 맥에서 --win 을 말면 darwin 이 박힌다 (closed-code 실측).
# `${arch}` 는 아키마다 다시 펼쳐져 각 산출물에 자기 것만 실린다.
extraResources:
  - from: build/vendor/opencode/${os}-${arch}
    to: opencode
  - from: build/vendor/rg/${os}-${arch}
    to: rg
  # 음성 입력 엔진·모델 (scripts/fetch-speech.mjs, +약 170MB) — node_modules/sherpa-onnx-node · sherpa-onnx-<platform>-<arch> · models/.
  # 런타임 자리는 src/services/speech/assets.ts bundledSpeechDir (Resources/speech). 폴더 이름을 바꾸지 않는다 — 본체가 네이티브 패키지를 이름으로 찾는다
  - from: build/vendor/speech/${os}-${arch}
    to: speech
  # 동봉한 것의 출처·라이선스 (SenseVoice 모델은 표기 의무가 있다)
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

mac:
  target:
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # electron-builder 의 신원 서명은 건너뛴다 — afterPack 이 서명한다
  identity: null
  # Electron 기본 문구("This app needs access to the microphone")를 우리 것으로 — 음성 입력(기능 voice)을 켜고 처음 녹음할 때 macOS 가 보여 준다.
  # hardened runtime 이 아니라 entitlement 는 필요 없다 (공증으로 가면 device.audio-input + disable-library-validation — 실측 01ag §2.4)
  extendInfo:
    NSMicrophoneUsageDescription: litecode uses the microphone for voice input. Speech is transcribed on this computer.

win:
  target:
    - target: nsis
      arch: [x64]

artifactName: litecode-${os}-${arch}.${ext}
