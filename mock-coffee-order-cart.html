<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장바구니</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: #efe9e2;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
  }
  .phone {
    width: 400px;
    background: #faf7f2;
    border-radius: 28px;
    box-shadow: 0 12px 48px rgba(62, 39, 22, .18);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* ── header (dimmed, same as order screen) ── */
  .store {
    background: linear-gradient(135deg, #6f4e37 0%, #4a3122 100%);
    color: #fff;
    padding: 22px 20px 18px;
    position: relative;
    flex-shrink: 0;
  }
  .store .row1 { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 54px; height: 54px; border-radius: 50%;
    background: #fdf6ec;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
  }
  .logo svg { height: 34px; width: auto; display: block; }
  .store h1 { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
  .store .meta { font-size: 12.5px; opacity: .85; margin-top: 4px; display: flex; gap: 10px; }
  .store .meta .open { color: #b8f0c0; font-weight: 600; }
  .store .badge {
    position: absolute; top: 14px; right: 14px;
    background: #f59e0b; color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 4px 9px; border-radius: 20px;
  }
  .scroll { flex: 1; overflow-y: auto; padding: 16px 16px 0; }
  .tabs { display: flex; gap: 8px; }
  .tab {
    border: none; background: #eadfd2; color: #6f4e37;
    font-size: 13px; font-weight: 600;
    padding: 8px 16px; border-radius: 20px; cursor: pointer;
    font-family: inherit;
  }
  .tab.active { background: #4a3122; color: #fdf6ec; }
  .item {
    display: flex; gap: 14px;
    background: #fff;
    border: 1.5px solid transparent;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .thumb {
    width: 74px; height: 74px; border-radius: 12px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb svg { height: 52px; width: auto; }
  .info .name { font-size: 15px; font-weight: 700; color: #2d1d12; }
  .info .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .price { font-size: 15px; font-weight: 800; color: #4a3122; }
  /* ── overlay + cart sheet (open by default) ── */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(30, 18, 10, .45);
    z-index: 5;
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 22px 22px 28px 28px;
    padding: 18px 18px 22px;
    z-index: 6;
    max-height: 88%;
    overflow-y: auto;
    transform: translateY(0);
    animation: slide .3s cubic-bezier(.3,.9,.35,1);
  }
  @keyframes slide { from { transform: translateY(45%); } to { transform: translateY(0); } }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #ddd2c4; margin: 0 auto 14px; }
  .sheet-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sheet-title h2 { font-size: 17px; font-weight: 800; color: #2d1d12; }
  .sheet-title h2 span { font-size: 12px; font-weight: 700; color: #f59e0b; margin-left: 5px; }
  .clear-btn {
    border: none; background: none; color: #a3947f;
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
    padding: 4px 6px; border-radius: 6px;
  }
  .clear-btn:hover { background: #f4ede3; color: #6b5d4f; }
  /* ── cart lines ── */
  .cart-line { display: flex; align-items: center; gap: 10px; padding: 13px 2px; }
  .cart-line + .cart-line, .cart-line + .memo, .memo + .coupon { border-top: 1px solid #f2ece3; }
  .cart-line .ico {
    width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .cart-line .ico svg { height: 32px; width: auto; }
  .cart-line .nm { flex: 1; min-width: 0; }
  .cart-line .nm b { font-size: 13.5px; color: #2d1d12; display: block; }
  .cart-line .nm span { font-size: 11.5px; color: #8a7a68; display: block; margin-top: 1px; }
  .cart-line .pr { font-size: 13px; font-weight: 700; color: #2d1d12; margin: 0 4px; white-space: nowrap; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 25px; height: 25px; border-radius: 7px;
    border: 1.5px solid #ddd2c4; background: #fff;
    font-size: 13px; cursor: pointer; font-family: inherit; color: #4a3122;
    transition: background .13s;
  }
  .qty button:hover:not(:disabled) { background: #f4ede3; }
  .qty button:disabled { color: #ccc2b5; cursor: not-allowed; }
  .qty span { font-size: 13px; font-weight: 700; min-width: 18px; text-align: center; }
  /* ── memo ── */
  .memo { padding: 13px 2px; }
  .memo label { font-size: 13px; font-weight: 700; color: #2d1d12; display: block; margin-bottom: 7px; }
  .memo textarea {
    width: 100%; border: 1.5px solid #ddd2c4; border-radius: 10px;
    font-family: inherit; font-size: 12.5px; color: #2d1d12;
    padding: 9px 11px; resize: none; height: 60px;
    transition: border-color .13s;
  }
  .memo textarea:focus { outline: none; border-color: #6f4e37; }
  /* ── coupon ── */
  .coupon { padding: 13px 2px; }
  .coupon label { font-size: 13px; font-weight: 700; color: #2d1d12; display: block; margin-bottom: 8px; }
  .coup-row { display: flex; gap: 8px; }
  .coup {
    flex: 1; border: 1.5px solid #ddd2c4; border-radius: 12px;
    background: #fff; padding: 9px 11px; cursor: pointer; font-family: inherit;
    text-align: left; transition: all .13s; position: relative;
  }
  .coup:hover { border-color: #b79a7d; }
  .coup.on { border-color: #4a3122; background: #faf3ea; box-shadow: 0 0 0 1px #4a3122; }
  .coup b { font-size: 12.5px; color: #2d1d12; display: block; }
  .coup span { font-size: 11px; color: #8a7a68; }
  .coup .chk {
    position: absolute; top: 8px; right: 8px;
    width: 17px; height: 17px; border-radius: 6px;
    border: 1.5px solid #cbb8a2;
    display: flex; align-items: center; justify-content: center;
  }
  .coup.on .chk { background: #4a3122; border-color: #4a3122; }
  .coup .chk svg { opacity: 0; }
  .coup.on .chk svg { opacity: 1; }
  /* ── fees ── */
  .fees { margin-top: 6px; border-top: 1px dashed #e3d8c8; padding-top: 12px; }
  .fee-row { display: flex; justify-content: space-between; font-size: 12.5px; color: #6b5d4f; padding: 3.5px 2px; }
  .fee-row .neg { color: #e11d48; font-weight: 600; }
  .fee-row.total { font-size: 15.5px; font-weight: 800; color: #2d1d12; padding-top: 10px; margin-top: 5px; border-top: 1.5px solid #2d1d12; }
  .fee-row.total .save { display: block; font-size: 11px; font-weight: 700; color: #e11d48; margin-top: 2px; }
  /* ── payment ── */
  .pay { margin-top: 14px; }
  .pay label { font-size: 13px; font-weight: 700; color: #2d1d12; display: block; margin-bottom: 8px; }
  .chips { display: flex; gap: 8px; }
  .chip {
    flex: 1; border: 1.5px solid #ddd2c4; background: #fff;
    color: #6b5d4f; font-size: 12.5px; font-weight: 700; font-family: inherit;
    padding: 10px 8px; border-radius: 10px; cursor: pointer;
    transition: all .13s; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .chip:hover { border-color: #b79a7d; }
  .chip.on { background: #4a3122; border-color: #4a3122; color: #fdf6ec; }
  /* ── sheet foot ── */
  .sheet-foot {
    margin-top: 16px; border-top: 1px solid #f2ece3; padding-top: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .sheet-foot .total { font-size: 18px; font-weight: 800; color: #2d1d12; }
  .sheet-foot .total small { display: block; font-size: 11px; font-weight: 600; color: #8a7a68; margin-bottom: 2px; }
  .confirm-btn {
    border: none; border-radius: 14px;
    background: #6f4e37; color: #fff;
    font-size: 15px; font-weight: 800; font-family: inherit;
    padding: 15px 32px; cursor: pointer; transition: background .15s, transform .12s;
  }
  .confirm-btn:hover:not(:disabled) { background: #5c4030; }
  .confirm-btn:active:not(:disabled) { transform: scale(.97); }
  .confirm-btn:disabled { background: #d9cfc2; cursor: wait; }
  /* ── toast ── */
  .toast {
    position: absolute; top: 18px; left: 50%;
    transform: translate(-50%, -80px);
    background: #2d1d12; color: #fdf6ec;
    font-size: 13px; font-weight: 700;
    padding: 11px 20px; border-radius: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    transition: transform .28s cubic-bezier(.3,1.2,.4,1);
    z-index: 20; white-space: nowrap;
  }
  .toast.on { transform: translate(-50%, 0); }
  /* ── done overlay ── */
  .done {
    position: absolute; inset: 0; z-index: 15;
    background: rgba(45, 29, 18, .94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fdf6ec; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    padding: 30px;
  }
  .done.on { opacity: 1; pointer-events: auto; }
  .done .mark {
    width: 76px; height: 76px; border-radius: 50%;
    background: #7cc98f;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    animation: pop .4s cubic-bezier(.3,1.6,.5,1) both .1s;
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .done h2 { font-size: 21px; font-weight: 800; margin-bottom: 8px; }
  .done .num { font-size: 14px; opacity: .85; }
  .done .num b { font-size: 24px; color: #f5c66b; margin: 0 3px; }
  .done p.sub { font-size: 12.5px; opacity: .7; margin-top: 6px; }
  .done button {
    margin-top: 26px; border: none; border-radius: 14px;
    background: #f5c66b; color: #2d1d12;
    font-size: 14px; font-weight: 800; font-family: inherit;
    padding: 13px 36px; cursor: pointer;
  }
  .done button:hover { background: #f7d089; }
</style>
</head>
<body>
<div class="phone">

  <header class="store">
    <div class="badge">배달 12~18분</div>
    <div class="row1">
      <div class="logo">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M14 22h30a2 2 0 0 1 2 2v3h4a6 6 0 0 1 0 12h-4v1a13 13 0 0 1-13 13H27a13 13 0 0 1-13-13V22z" fill="#6f4e37"/>
          <path d="M18 26v22a9 9 0 0 0 9 9h8a9 9 0 0 0 9-9V26H18z" fill="#c99b6d"/>
          <path d="M24 25c0-3 2-4 2-7M32 25c0-3 2-4 2-7" stroke="#8a6a4f" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>브라운 하트 커피</h1>
        <div class="meta"><span class="open">● 영업 중</span><span>10:00 – 22:00</span><span>평점 4.8 ★</span></div>
      </div>
    </div>
  </header>

  <div class="scroll">
    <div class="tabs">
      <button class="tab active">전체</button>
      <button class="tab">커피</button>
      <button class="tab">티</button>
      <button class="tab">디저트</button>
    </div>
    <div style="margin-top:14px">
      <div class="item">
        <div class="thumb" style="background:#e9d9c6" id="bg1"></div>
        <div class="info"><div class="name">아메리카노</div>
          <div class="bottom"><span class="price">3,500원</span></div></div>
      </div>
      <div class="item">
        <div class="thumb" style="background:#f0e3c8" id="bg2"></div>
        <div class="info"><div class="name">바닐라 라떼</div>
          <div class="bottom"><span class="price">5,000원</span></div></div>
      </div>
    </div>
  </div>

  <div class="overlay"></div>

  <div class="sheet" id="cartSheet">
    <div class="grab"></div>
    <div class="sheet-title">
      <h2>장바구니<span id="cnt"></span></h2>
      <button class="clear-btn" id="clearBtn">전체 비우기</button>
    </div>

    <div id="lines"></div>

    <div class="memo">
      <label>배달 메모</label>
      <textarea placeholder="예: 203호, 벨이 없습니다 / 아이스 컵 따로 주세요" id="memo"></textarea>
    </div>

    <div class="coupon">
      <label>쿠폰</label>
      <div class="coup-row">
        <button class="coup on" data-d="3000" id="coup1">
          <b>3,000원 할인</b><span>주문 3,000원 이상</span>
          <span class="chk"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button class="coup" data-d="0" id="coup2">
          <b>배달비 무료</b><span>주문 10,000원 이상</span>
          <span class="chk"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </div>

    <div class="fees">
      <div class="fee-row"><span>상품 가격</span><span id="fSub">0원</span></div>
      <div class="fee-row"><span>배달비</span><span id="fDel">3,000원</span></div>
      <div class="fee-row"><span>포장비</span><span>800원</span></div>
      <div class="fee-row" id="fCoupRow" style="display:none"><span>쿠폰 할인</span><span class="neg" id="fCoup">-0원</span></div>
    </div>
    <div class="fees" style="border-top:none; padding-top:0">
      <div class="fee-row total"><span>합계<span class="save" id="fSave" style="display:none"></span></span><span id="fTotal">0원</span></div>
    </div>

    <div class="pay">
      <label>결제 수단</label>
      <div class="chips" id="payChips">
        <button class="chip on" data-p="card">💳 신한카드</button>
        <button class="chip" data-p="pay">Ⓟ SSG Pay</button>
        <button class="chip" data-p="cash">💵 온누리상품권</button>
      </div>
    </div>

    <div class="sheet-foot">
      <div class="total"><small>결제 예정 금액</small><span id="footTotal">0원</span></div>
      <button class="confirm-btn" id="orderBtn">주문하기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="done" id="done">
    <div class="mark">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>주문 완료!</h2>
    <div class="num">주문번호 <b id="orderNo">#000</b></div>
    <p class="sub">약 12~18분 후 배달이 시작돼요. 준비되면 알림이 도착해요.</p>
    <button id="doneBtn">확인</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString('ko-KR') + '원';

function cupSVG(c1, c2, id) {
  return `<svg viewBox="0 0 80 80" fill="none">
    <ellipse cx="40" cy="70" rx="26" ry="6" fill="rgba(0,0,0,.07)"/>
    <path d="M20 28h40l-4 36a6 6 0 0 1-6 5H30a6 6 0 0 1-6-5l-4-36z" fill="${c1}"/>
    <path d="M22.5 34h35l-3 28a4 4 0 0 1-4 3.6h-22A4 4 0 0 1 25.5 62l-3-28z" fill="${c2}"/>
    <path d="M60 34h5a8 8 0 0 1 0 16h-7l1.2-9.6z" fill="${c1}"/>
  </svg>`;
}
$('bg1').innerHTML = cupSVG('#e9d9c6', '#5a3d28', 'a');
$('bg2').innerHTML = cupSVG('#f0e3c8', '#a0713f', 'b');

const lines = [
  { name:'아메리카노', opts:'M · ICE · 정상', price:5000, qty:2, color:['#e9d9c6','#5a3d28'] },
  { name:'바닐라 라떼', opts:'M · HOT · 조금 달게', price:6000, qty:1, color:['#f0e3c8','#a0713f'] },
  { name:'버터 크루아상', opts:'디저트', price:4500, qty:1, color:['#f2e3cb','#c99b55'] },
];

const DELIVERY = 3000, PACKING = 800;
let coupon = 3000;
let toastTimer;

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

function render() {
  const box = $('lines');
  box.innerHTML = '';
  if (!lines.length) {
    box.innerHTML = '<div style="text-align:center;color:#a3947f;font-size:13px;padding:22px 0">장바구니가 비어 있어요 ☕</div>';
  } else {
    lines.forEach(l => {
      const d = document.createElement('div');
      d.className = 'cart-line';
      d.innerHTML = `
        <div class="ico" style="background:${l.color[0]}">${cupSVG(l.color[0], l.color[1], l.name)}</div>
        <div class="nm"><b>${l.name}</b><span>${l.opts}</span></div>
        <span class="pr">${won(l.price * l.qty)}</span>
        <div class="qty">
          <button data-a="minus">−</button><span>${l.qty}</span><button data-a="plus">+</button>
        </div>`;
      d.querySelector('[data-a="minus"]').onclick = () => { l.qty > 1 ? l.qty-- : lines.splice(lines.indexOf(l), 1); render(); };
      d.querySelector('[data-a="plus"]').onclick = () => { if (l.qty < 20) { l.qty++; } render(); };
      box.appendChild(d);
    });
  }
  const n = lines.reduce((s, l) => s + l.qty, 0);
  $('cnt').textContent = n ? `· ${n}건` : '';
  const sub = lines.reduce((s, l) => s + l.price * l.qty, 0);
  const del = coupon === 'free' && sub >= 10000 ? 0 : DELIVERY;   // free-delivery coupon
  const discount = (coupon && sub >= 3000) ? coupon : 0;
  const total = Math.max(0, sub + del + PACKING - discount);
  $('fSub').textContent = won(sub);
  $('fDel').textContent = del === 0 ? '무료' : won(del);
  $('fCoupRow').style.display = discount ? '' : 'none';
  $('fCoup').textContent = '-' + won(discount);
  $('fSave').style.display = discount ? '' : 'none';
  $('fSave').textContent = `쿠폰 ${won(discount)} 할인 적용됨`;
  $('fTotal').textContent = won(total);
  $('footTotal').textContent = won(total);
  return { n, sub, total };
}

document.querySelectorAll('.coup').forEach(c => c.onclick = () => {
  document.querySelectorAll('.coup').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  coupon = c.id === 'coup1' ? 3000 : (c.id === 'coup2' ? 'free' : 0);
  render();
});

document.querySelectorAll('#payChips .chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('#payChips .chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
});

$('clearBtn').onclick = () => {
  if (!lines.length) return;
  lines.length = 0;
  render();
  showToast('장바구니를 비웠어요');
};

$('orderBtn').onclick = () => {
  const s = render();
  if (!s.n) { showToast('먼저 메뉴를 담아요'); return; }
  const btn = $('orderBtn');
  btn.disabled = true;
  btn.textContent = '주문 진행 중…';
  setTimeout(() => {
    $('orderNo').textContent = '#' + (100 + (Math.random() * 900 | 0));
    $('done').classList.add('on');
    btn.disabled = false;
    btn.textContent = '주문하기';
  }, 900);
};

$('doneBtn').onclick = () => {
  $('done').classList.remove('on');
  lines.length = 0;
  render();
};

render();
</script>
</body>
</html>
